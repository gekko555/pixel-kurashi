spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pixel_kurashi?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Tokyo

server:
  port: 8080

logging:
  level:
    com.example.pixelkurashi: DEBUG

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
